[package]
name = "ss-audio-macos"
description = "macOS backend for AudioMix: audio process taps, private aggregate device and IOProc driving ss-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ss-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ss-engine.workspace = true
ss-dsp.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSDictionary", "NSValue"] }
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
ss-hal-driver-macos.workspace = true

[lints]
workspace = true
