# Built-in AudioMix channel suggestions (docs/architecture/app.md §3.2).
#
# One [[app]] block per program:
#   name    = what the user sees
#   channel = "game" | "chat" | "media" | "aux"
#   macos   = bundle-id prefixes (a prefix also covers helpers, e.g. "com.google.Chrome")
#   windows = executable names, case-insensitive
#
# Own assignments in the AudioMix list always win. Games are mostly recognised without this list
# (game library folders on Windows, the games category on macOS); list only games installed
# elsewhere. Ids are public program identifiers; a wrong or outdated id only means "no match".
# A test checks this file (valid channels, no id twice) — run `cargo test -p ss-app catalogue`.

# ── Chat ──────────────────────────────────────────────────────────────────────────────────────

[[app]]
name = "Discord"
channel = "chat"
macos = ["com.hnc.Discord"]
windows = ["discord.exe", "discordptb.exe", "discordcanary.exe"]

