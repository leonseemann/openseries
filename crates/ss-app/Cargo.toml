[package]
name = "ss-app"
description = "OpenSeries menu-bar app: headset control, AudioMix and virtual mic (docs/architecture/app.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "openseries"
path = "src/main.rs"

[dependencies]
ss-core.workspace = true
ss-dsp.workspace = true
ss-engine.workspace = true
ss-store.workspace = true
ss-device.workspace = true
ss-devices.workspace = true
ss-audio-macos.workspace = true
ss-update.workspace = true
anyhow.workspace = true
ctrlc.workspace = true
# UI (ADR 0005): all MIT OR Apache-2.0.
eframe = "0.32"
tray-icon = "0.24"
global-hotkey = "0.7"
# Open/save dialogs for preset import/export (MIT).
rfd = "0.18"
# Desktop notifications (MIT OR Apache-2.0).
notify-rust = "4"
# HTTPS for the update check and download (MIT OR Apache-2.0; rustls, no OpenSSL).
ureq = "3"
# instance.json (single instance, app.md §9).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The built-in app catalogue (data/app-catalogue.toml, app.md §3.2; MIT OR Apache-2.0).
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
ss-usb-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ss-window-windows.workspace = true
ss-audio-windows.workspace = true
raw-window-handle = "0.6"

[dev-dependencies]
# Encodes the bundled icon files in the icon test (MIT OR Apache-2.0).
png = "0.18"

[build-dependencies]
# Embeds the app icon and version info into openseries.exe (MIT).
winresource = "0.1"

[lints]
workspace = true
