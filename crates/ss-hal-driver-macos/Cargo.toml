[package]
name = "ss-hal-driver-macos"
description = "Virtual microphone for macOS: a loopback AudioServerPlugIn (OpenSeries Microphone)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# cdylib = the driver binary inside OpenSeriesMic.driver; rlib = portable logic for tests.
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"

[lints]
workspace = true
