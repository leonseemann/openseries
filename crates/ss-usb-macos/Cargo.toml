[package]
name = "ss-usb-macos"
description = "macOS USB helpers: re-enumerate a device (software re-plug) via IOUSBHost."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSValue", "NSError", "NSString"] }
objc2-core-foundation = "0.3"
objc2-io-kit = "0.3"
objc2-io-usb-host = "0.3"

[lints]
workspace = true
