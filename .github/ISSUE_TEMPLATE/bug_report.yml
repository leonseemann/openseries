name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open AudioMix
        2. …
  - type: input
    id: version
    attributes:
      label: OpenSeries version
      description: Shown in the app's About page.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2 / macOS 26.1"
  - type: input
    id: device
    attributes:
      label: Device(s)
      placeholder: "Arctis Nova Pro Wireless"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, if any.
      render: text
