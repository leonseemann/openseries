name: Feature request
description: Suggest a feature or support for a new device.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: input
    id: device
    attributes:
      label: Device (for device support)
      description: Model name and, if you know it, the USB vendor/product ID.
