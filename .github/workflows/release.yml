# Builds the installers and publishes a GitHub release (ADR 0006, docs/architecture/release.md).
#
# * Push a tag `vX.Y.Z` (equal to the workspace version) → packages are built, signed with the
#   update key and published as a release; installed apps offer the update.
# * Run manually (workflow_dispatch) → the same packages as workflow artifacts, nothing published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Ed25519 private key for update signatures (repository secret, base64).
  UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

jobs:
  version:
    name: version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Workspace version matches the tag
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace version $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build
        run: cargo build --release --locked -p ss-app
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" installer\windows\openseries.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect
        run: |
          mkdir -p dist
          cp "target/installer/OpenSeries-$VERSION-windows-x64-setup.exe" dist/
      - name: Sign for in-app updates
        run: scripts/release-sign.sh dist/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      # App Store Connect API key for notarization (base64 .p8, key ID, issuer ID).
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Apple secrets present
        # Releases must be Developer ID signed and notarized; manual test runs may skip it
        # (ad-hoc signed then).
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "APPLE_SIGNING=1" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::missing Apple secrets:$missing (docs/architecture/release.md §3)"
            exit 1
          else
            echo "::warning::missing Apple secrets:$missing; building ad-hoc signed"
          fi
      - name: Import the Developer ID certificate
        if: env.APPLE_SIGNING == '1'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The SHA-1 of the "Developer ID Application: … (TEAMID)" identity.
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::no 'Developer ID Application' identity in MACOS_CERTIFICATE"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build the app bundle
        run: scripts/macos/app.sh build
      - name: Notarize and staple
        if: env.APPLE_SIGNING == '1'
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY" | base64 --decode > "$key"
          ditto -c -k --keepParent target/OpenSeries.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm "$key"
          status=$(sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            echo "::error::notarization status: $status (see the log above; 'xcrun notarytool log <id>' shows why)"
            exit 1
          fi
          xcrun stapler staple target/OpenSeries.app
          spctl --assess --type execute --verbose=2 target/OpenSeries.app
      - name: Package
        run: |
          mkdir -p dist
          codesign --verify --deep --strict --verbose=2 target/OpenSeries.app
          ditto -c -k --keepParent target/OpenSeries.app "dist/OpenSeries-$VERSION-macos-arm64.zip"
      - name: Sign for in-app updates
        run: scripts/release-sign.sh dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    if: github.ref_type == 'tag'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenSeries $VERSION" \
            --generate-notes

  homebrew:
    name: Homebrew cask
    # Points leonseemann/homebrew-tap at the new release (release.md §1). Without the deploy key
    # the release still succeeds and the cask is bumped by hand.
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - id: key
        name: Deploy key present
        run: |
          if [ -n "$TAP_DEPLOY_KEY" ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY missing; bump the cask by hand (release.md §1)"
          fi
      # The zip of this run: the same bytes as the release asset.
      - uses: actions/download-artifact@v8
        if: steps.key.outputs.present == '1'
        with:
          name: macos
          path: dist
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == '1'
        with:
          repository: leonseemann/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Bump version and checksum
        if: steps.key.outputs.present == '1'
        run: |
          sha=$(sha256sum "dist/OpenSeries-$VERSION-macos-arm64.zip" | cut -d' ' -f1)
          cask=tap/Casks/openseries.rb
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$cask"
          grep -q "^  version \"$VERSION\"" "$cask" && grep -q "^  sha256 \"$sha\"" "$cask" || {
            echo "::error::could not update $cask"
            exit 1
          }
          cd tap
          if git diff --quiet; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: openseries $VERSION"
          git push
