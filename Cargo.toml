[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
ss-core = { path = "crates/ss-core" }
ss-nova-pro = { path = "crates/ss-nova-pro" }
ss-hid = { path = "crates/ss-hid" }
thiserror = "2"
anyhow = "1"
hidapi = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
