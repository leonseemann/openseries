[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ss-core = { path = "crates/ss-core" }
ss-nova-pro = { path = "crates/ss-nova-pro" }
ss-hid = { path = "crates/ss-hid" }
thiserror = "2"
anyhow = "1"
hidapi = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hound = "3"
rtrb = "0.3"
ss-engine = { path = "crates/ss-engine" }
ss-audio-macos = { path = "crates/ss-audio-macos" }
ss-dsp = { path = "crates/ss-dsp" }
ss-hal-driver-macos = { path = "crates/ss-hal-driver-macos" }
ss-store = { path = "crates/ss-store" }
ss-usb-macos = { path = "crates/ss-usb-macos" }
ss-audio-windows = { path = "crates/ss-audio-windows" }
ss-window-windows = { path = "crates/ss-window-windows" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
